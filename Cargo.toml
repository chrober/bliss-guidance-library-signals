[package]
name = "bliss-guidance-library-signals"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Guidance addon supplying Lyrion listening and library signals to Bliss playlist optimization"
repository = "https://github.com/chrober/bliss-guidance-library-signals"
publish = false

[dependencies]
bliss-playlist-guidance-spi = { git = "https://github.com/chrober/bliss-playlist-guidance-spi.git", rev = "bb69c28" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
